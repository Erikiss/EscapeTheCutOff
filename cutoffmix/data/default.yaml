# cutoffmix default configuration (DESIGN.md §1 and §3.1).
#
# Load with cutoffmix.config.load_config(); a custom file or an `overrides` dict is deep-merged on top of this one.
# In overrides, `models` may be a list (replaces all models) or a mapping {model key: {field: value}} that patches
# individual models.

today: null                       # ISO date for the system prompt; null -> the current date
base_url: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API_KEY
app_title: cutoffmix

models:
  - key: claude-fable-5.2
    provider_id: anthropic/claude-fable-5.2
    display: Claude Fable 5.2
    color: "#d97757"
    supports_stop: true           # all Fable endpoints honour `stop`
    supports_temperature: false   # Fable 5.2 rejects temperature/top_p
    cancellable: true             # closing the stream stops billing on anthropic/azure
    provider_routing:             # `only` keeps routing on cancellable providers; fallbacks stay on so that an
      only: [anthropic, azure]    # outage at one is served by the other (allow_fallbacks: false without `order`
                                  # would serve only the top-ranked provider)
    reasoning: {effort: low, exclude: true}
    cache_style: anthropic        # explicit cache_control on the system block and the last notes block
    max_tokens_slack: 2048
    extra_body: {}                # never put `verbosity` here: OpenRouter maps it to Claude's effort

  - key: gpt-6.2-sol
    provider_id: openai/gpt-6.2-sol
    display: GPT-6.2 Sol
    color: "#10a37f"
    supports_stop: false          # no Sol endpoint supports `stop`; the sentinel is detected client-side
    supports_temperature: false
    cancellable: true             # openai/azure stop billing on disconnect
    provider_routing:
      only: [openai, azure]       # failover between the two, as for Fable
    reasoning: {effort: low, exclude: true}
    cache_style: openai           # automatic caching + prompt_cache_key per run
    max_tokens_slack: 2048
    extra_body:
      verbosity: low

  - key: gemini-4-neon
    provider_id: google/gemini-4-neon
    display: Gemini 4 Neon
    color: "#4285f4"
    supports_stop: true           # only on google-vertex, hence the pin below
    supports_temperature: false   # Google ignores in-range temperature/top_p/top_k (400 out of range); never sent
    cancellable: false            # Google keeps generating (and billing) after a disconnect
    provider_routing:
      only: [google-vertex]       # base slug: any google-vertex endpoint (all support `stop`), not the priority tier
    reasoning: {effort: low, exclude: true}
    cache_style: implicit         # Gemini 4: implicit caching only (>= 4096 tokens)
    max_tokens_slack: 1536        # kept tight because aborting does not stop billing
    extra_body: {}

relay:
  segment_tokens: 128
  hard_cut_chars: 600
  max_segments: 60
  window_segments: 3
  strategy: sequential
  speculative_gate: 0.5
  answer_mode: routed
  answer_max_tokens: 1024
  sentinel: "<<END_STEP>>"
  final_marker: "FINAL ANSWER:"
  inject_date: true
  max_retries: 2
  disable_after_refusals: 2
  first_content_timeout_s: 60.0   # per attempt, until the first visible text; keep-alive comments do not reset it
  segment_timeout_s: 120.0        # per attempt, the whole stream (drafts and answers included)

router:
  policy: softmax
  T0: 0.5
  beta: 0.25
  kappa: 1.0
  lam: 0.5
  r_min: 0.05
  delta: 0.5
  ema: 0.5
  index_path: null
  probe_preference: [current_d, current, recall, mcq]
  classifier: auto
  classifier_path: null
  gate_path: null                 # gate_linear.npz from `cutoffmix router train`; null -> the lexical gate
  seed: null

# Explore preset (DESIGN.md §7): off by default; `cutoffmix run --preset explore` merges data/presets/explore.yaml,
# which turns it on. Every value below is ignored while `enabled` is false.
explore:
  enabled: false
  seed: null                      # overrides the run seed (router.seed / --seed) for the client-side draws when set
  min_segments: 6                 # main-line notes (lens and check notes not counted) before a conclusion is accepted
  require_labels: ["Evidence:", "Alternative set aside:", "Open question:"]
  where_we_stand_window: 2        # a 'Where we stand:' line must appear in one of the last 2 notes
  max_forced_continuations: 3
  loop_overlap_jaccard: 0.5       # word-3-gram Jaccard of the last two notes above this -> stop forcing
  cues:
    - "Alternatively, "
    - "One thing not yet checked: "
    - "The strongest objection to the current conclusion is "
    - "Perhaps the missing piece is "
    - "Before closing, the weakest assumption above is "
  lens:
    p: 0.25                       # per eligible segment
    p_stagnation: 0.50
    min: 1                        # force one lens at the last eligible slot if none was drawn
    max: 2
    first_index: 2                # 0-based: never in the first two segments
    cooldown: 2                   # segments after a check before the next lens may be drawn
    tiers: {mid: 0.55, far: 0.35, near: 0.10}
    exclude_from_window: true     # lens notes are not part of the routing window
    check_other_model: true       # the check is routed away from the lens writer
  vs_menu: "off"                  # off | stagnation | every_lens; the side call always runs on gpt-6.2-sol
  answer_basis: true              # the answer ends with 'Basis:' and 'Not resolved:'
  light_schema_models: []         # default system prompt + tail without the label checklist (Fable's input filter)
