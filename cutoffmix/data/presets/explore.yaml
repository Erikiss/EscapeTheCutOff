# cutoffmix `explore` preset (DESIGN.md §7): structured shared notes, a record gate before FINAL ANSWER:, a
# client-side domain lens with a check by another model, and forced continuations when a model concludes early.
#
# Loaded with `cutoffmix run --preset explore` / `cutoffmix serve --preset explore` / load_config(preset="explore"):
# deep-merged over data/default.yaml BEFORE a user --config file and overrides, so both can still change any value.
# Routing by cutoff stays the product: this preset does not change router.policy (with the shipped prior index
# GPT-6.2 Sol is freshest on every topic; pass --policy round_robin to see all three writers).
# No temperature or top_p is sent to any model: Fable 5.2 and GPT-6.2 Sol have no such parameter and Google ignores
# it on Gemini 4 Neon; the wandering comes from the lens texts and the protocol, not from sampling.

relay:
  segment_tokens: 192             # was 128
  hard_cut_chars: 1500            # 192 tokens of German run to ~1100-1300 chars; at 1000 the cut removed the trailing
                                  # 'Where we stand:' line in the first live run (relay closes a stream at 1.5x = 2250)
  max_segments: 16                # hard ceiling (16 x 192 ~ 3k note tokens, under the 4096 cap)
  answer_mode: routed
  # window_segments stays 3; lens segments are excluded from the routing window by the relay

explore:
  enabled: true
  seed: null                      # run seed for every client-side draw; null -> the run seed (--seed / router.seed)
  min_segments: 6                 # main-line notes (lens and check notes not counted) before a conclusion is accepted
  require_labels: ["Evidence:", "Alternative set aside:", "Open question:"]
  where_we_stand_window: 2        # a 'Where we stand:' line must appear in one of the last 2 notes
  max_forced_continuations: 3
  loop_overlap_jaccard: 0.5       # word-3-gram Jaccard of the last two notes above this -> stop forcing
  cues:
    - "Alternatively, "
    - "One thing not yet checked: "
    - "The strongest objection to the current conclusion is "
    - "Perhaps the missing piece is "
    - "Before closing, the weakest assumption above is "
  lens:
    p: 0.25                       # per eligible segment
    p_stagnation: 0.50
    min: 1                        # force one lens at the last eligible slot if none was drawn
    max: 2
    first_index: 2                # 0-based: never in the first two segments
    cooldown: 2                   # segments after a check before the next lens may be drawn
    tiers: {mid: 0.55, far: 0.35, near: 0.10}
    exclude_from_window: true     # lens notes are not part of the routing window
    check_other_model: true       # the check is routed away from the lens writer
  vs_menu: "off"                  # off | stagnation | every_lens; the side call always runs on gpt-6.2-sol
  answer_basis: true              # the answer ends with 'Basis:' and 'Not resolved:'

models:
  gemini-4-neon:
    supports_temperature: false   # Google ignores it; OpenRouter only passes it through
  gpt-6.2-sol:
    extra_body: {verbosity: medium}       # notes (default: low)
    answer_extra_body: {verbosity: low}   # applied in phase 'answer' only
    supports_seed: true                   # body['seed'] = hash(run seed, segment index)
