[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cutoffmix"
version = "0.1.0"
description = "Live multi-model chain-of-thought relay routed by topic-specific effective knowledge cutoff"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "numpy>=1.26",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
embed = ["sentence-transformers>=3.0"]
gpu = ["torch>=2.4", "transformers>=4.45", "accelerate>=0.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
cutoffmix = "cutoffmix.cli:main"

[tool.setuptools.packages.find]
include = ["cutoffmix*"]

[tool.setuptools.package-data]
cutoffmix = ["web/*.html", "data/*.json", "data/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
